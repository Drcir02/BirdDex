# HOW TO SWITCH THIS ON (one time, 1 minute): on GitHub open the repo, Add file, Create new file, type the name
# .github/workflows/pages.yml and paste this whole file, then Commit. After that open Settings, Pages, and set
# Source to "GitHub Actions". From then on every push to main builds the app, downloads the bird models, and publishes it.
# The file lives in deploy/ instead of .github/ because the Claude GitHub App is not allowed to push workflow files.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Download the bird models (the app still builds without them)
        run: node scripts/fetch-models.mjs
        continue-on-error: true
      - run: npm run build
        env:
          # GitHub Pages serves the site under /<repo-name>/.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
